[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "unbodysoma"
dynamic = ["version"]
description = "An embodied human simulation engine whose mind emerges from regulating its body."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Galen Chu" }]
requires-python = ">=3.11"
dependencies = []
classifiers = [
    "Development Status :: 1 - Planning",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff==0.17.*", "mypy==2.4.*"]

[project.urls]
Repository = "https://github.com/Galen-Chu/Unbodysoma"

[tool.setuptools.dynamic]
version = { attr = "unbodysoma.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
unbodysoma = ["py.typed"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
markers = ["slow: multi-hour simulations (included by default; skip with -m 'not slow')"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
