name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy
      - run: python -m unbodysoma.catalog --check
      - run: python -m unbodysoma validate scenarios/fear_response.toml scenarios/fear_without_interoception.toml scenarios/feeding.toml scenarios/grid_72h.toml scenarios/sanctuary_meadow_s1.toml

  test-fast:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e ".[dev]"
      # Failures surface as public error annotations (::error::), so the
      # failing test is visible without log access.
      - run: pytest -q 2>&1 | tee pytest.log; code=$?; grep -E "^FAILED" pytest.log | sed "s/^FAILED /::error::/" || true; exit $code -m "not slow"

  test-slow:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -e ".[dev]"
      # Failures surface as public error annotations (::error::), so the
      # failing test is visible without log access.
      - run: pytest -q 2>&1 | tee pytest.log; code=$?; grep -E "^FAILED" pytest.log | sed "s/^FAILED /::error::/" || true; exit $code
      - run: python examples/fear_response.py
      - run: python examples/lesion_study.py --runs runs/lesion_study
      - run: python examples/feeding.py --runs runs/feeding
      - run: python examples/grid_life.py --hours 6
      - run: python -m unbodysoma run scenarios/fear_response.toml --out runs/fear
      - run: python -m unbodysoma replay runs/fear
